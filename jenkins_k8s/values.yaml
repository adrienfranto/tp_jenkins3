# Custom Jenkins Helm configuration values.yaml
# Modified for DevOps Mini-Project requirements

controller:
  admin:
    username: "admin"
    password: "adminpassword123"
  
  serviceType: NodePort
  nodePort: 32000

  # Active plugins required for pipeline and Kubernetes agent
  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - blueocean:latest

  # CPU/Memory configurations
  resources:
    limits:
      cpu: "2000m"
      memory: "4096Mi"
    requests:
      cpu: "1000m"
      memory: "2048Mi"

agent:
  enabled: true
  image:
    repository: "jenkins/inbound-agent"
    tag: "latest"
